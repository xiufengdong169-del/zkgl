server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name _;

  root /opt/zkgl/current/apps/web/dist;
  index index.html;

  # Configure real certificate paths before production enablement.
  ssl_certificate /etc/letsencrypt/live/zkgl/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/zkgl/privkey.pem;

  location = /_zkgl_auth {
    internal;
    proxy_pass http://127.0.0.1:3010/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-ZKGL-CloudBase-UID "";
  }

  location = /api {
    auth_request /_zkgl_auth;
    auth_request_set $zkgl_cloudbase_uid $upstream_http_x_zkgl_cloudbase_uid;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-ZKGL-CloudBase-UID $zkgl_cloudbase_uid;
    proxy_set_header Authorization "";
    proxy_pass http://127.0.0.1:3000/api;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
